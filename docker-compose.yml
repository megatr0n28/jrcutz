
services:
  db:
    image: postgres:17-alpine
    container_name: jrcutz-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15

  db-migrate:
    image: migrate/migrate:v4.18.3
    container_name: jrcutz-db-migrate
    volumes:
      - ./backend/migrations:/migrations:ro
    environment:
      MIGRATE_DATABASE_URL: ${DATABASE_URL}
    command: ["-path=/migrations", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable", "up"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./backend
    # Uses the GHCR image in production, falls back to a local tag if building locally
    image: ${BACKEND_IMAGE:-jrcutz-backend:local}
    container_name: jrcutz-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SHOP_TIMEZONE: ${SHOP_TIMEZONE:-America/New_York}
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    # Uses the GHCR image in production, falls back to a local tag if building locally
    image: ${FRONTEND_IMAGE:-jrcutz-frontend:local}
    container_name: jrcutz-frontend
    restart: unless-stopped
    # REMOVED ports here so it is not exposed directly to the public web
    # ports:
    #   - "8080:80"
    depends_on:
      - api

  # ADDED Reverse Proxy to manage your DuckDNS Domain and HTTPS SSL
  reverse-proxy:
    image: caddy:2-alpine
    container_name: jrcutz-caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-jrcutz.duckdns.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - api

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
